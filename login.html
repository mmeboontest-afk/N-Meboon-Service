<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — N'Meboon</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="error-page">
  <div class="error-card">
    <p class="error-code" style="font-size:2.6rem">🔐</p>
    <h1 class="error-title">Login</h1>
    <p class="error-desc">Sign in with your Discord account to see your profile and level. Discord is the only login method.</p>
    <p id="login-error" class="error-desc" style="color:#C62828; display:none"></p>
    <a class="error-home-btn" href="/auth/discord" style="background:#5865F2">Login with Discord</a>
    <p style="margin:18px 0 0"><a href="/" style="color:var(--muted); font-size:.85rem">← Back to Home</a></p>
  </div>
</main>
<script>
const ERRORS = {
  not_configured: 'Discord login is not set up yet on this server.',
  discord_denied: 'Login was cancelled.',
  bad_state: 'Login session expired — please try again.',
  missing_code: 'Discord did not return a login code — please try again.',
  token_exchange_failed: 'Discord rejected the login — please try again.',
  user_fetch_failed: 'Could not read your Discord profile — please try again.',
  server_error: 'Something went wrong on our side — please try again.',
};
const err = new URLSearchParams(location.search).get('error');
if (err) {
  const el = document.getElementById('login-error');
  el.textContent = ERRORS[err] || 'Login failed — please try again.';
  el.style.display = 'block';
}
</script>
</body>
</html>
