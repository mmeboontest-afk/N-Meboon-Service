<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translate Video Titles</title>
<style>
  body{ font-family:system-ui,sans-serif; background:#FAFAF6; color:#14171A; margin:0; padding:24px; }
  .wrap{ max-width:680px; margin:0 auto; }
  .card{ background:#fff; border:1px solid #ECECE4; border-radius:16px; padding:20px; margin-bottom:16px; }
  button{ border:none; border-radius:999px; padding:12px 22px; font-weight:700; cursor:pointer; background:#14171A; color:#fff; }
  button:disabled{ opacity:.5; cursor:default; }
  pre{ background:#14171A; color:#C8FA5C; padding:14px; border-radius:12px; max-height:360px; overflow:auto; font-size:.82rem; white-space:pre-wrap; }
  a.btn{ display:inline-block; background:#37AEFF; color:#fff; text-decoration:none; padding:10px 18px; border-radius:999px; font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🌐 Translate Every Video Title</h1>

  <div class="card">
    <p id="auth-status">Checking Google authorization…</p>
    <a class="btn" href="/admin/youtube-oauth/start">Authorize Google Account</a>
  </div>

  <div class="card">
    <p>Runs in batches to respect YouTube's daily quota — click again later to continue where it left off if you have a lot of videos.</p>
    <button id="run-btn" onclick="runBatch()">▶ Run Translation Batch</button>
  </div>

  <div class="card">
    <pre id="log">Logs will appear here…</pre>
  </div>
</div>

<script>
async function checkAuth() {
  const r = await fetch('/api/admin/translate-status');
  const d = await r.json();
  document.getElementById('auth-status').textContent = d.authorized
    ? '✅ Google account authorized.'
    : '❌ Not authorized yet — click "Authorize Google Account" below (one-time setup).';
}
checkAuth();

function runBatch() {
  const btn = document.getElementById('run-btn');
  const log = document.getElementById('log');
  log.textContent = '';
  btn.disabled = true;

  const es = new EventSource('/api/admin/translate-run');
  es.onmessage = (e) => {
    const line = JSON.parse(e.data);
    if (typeof line === 'string' && line.startsWith('__DONE__')) {
      const result = JSON.parse(line.replace('__DONE__', ''));
      log.textContent += `\n🏁 Done this run: ${result.updatedThisRun} updated, ${result.failedThisRun} failed, ${result.remaining} remaining.\n`;
      btn.disabled = false;
      es.close();
      return;
    }
    log.textContent += line + '\n';
    log.scrollTop = log.scrollHeight;
  };
  es.onerror = () => { btn.disabled = false; es.close(); };
}
</script>
</body>
</html>
